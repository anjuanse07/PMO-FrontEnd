<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maintenance Schedule Table</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <!-- React & ReactDOM from CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js">
    </script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js">
    </script>
    <!-- Babel standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js">
    </script>
    <style>
        /* Custom scrollbar & subtle extras */
        .table-scroll::-webkit-scrollbar {
            height: 8px;
        }
        .table-scroll::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 6px;
        }
        .table-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 6px;
        }
        .table-scroll::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Status badge pulse animation for "GFS" */
        @keyframes pulse-gfs {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);
            }
            50% {
                box-shadow: 0 0 0 6px rgba(239, 68, 68, 0);
            }
        }
        .badge-gfs {
            animation: pulse-gfs 1.8s ease-in-out infinite;
        }

        /* Table header sticky + gradient */
        .sticky-header th {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        /* Row hover effect */
        .table-row:hover {
            background-color: #f8fafc !important;
            transition: background-color 0.15s ease;
        }
    </style>
</head>
<body>

    <div id="root" class="p-6 bg-slate-50 min-h-screen font-sans"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        // ─── Sample Data ──────────────────────────────────────────────
        const rawData = [{
            id: 'EO 273',
            name: 'DEHUMIDIFIER AHU LIQUID CAPSULE',
            spec: '1100 CMH',
            location: 'NBL 2, MEZZANINE LT.2',
            code: '1AS',
            // JAN, FEB, MAR, APR, MEI, JUN, AUG, SEP, OCT, NOV
            status: ['CFS', 'CFS', 'CFS', 'CFS', 'CFS', 'GFS', 'CFS', 'CFS', 'CFS', 'CFS']
        }, {
            id: 'EO 277',
            name: 'AHU-04146 KWN',
            spec: '—',
            location: 'NBL 2, MEZZANINE LT.3',
            code: '1AS',
            status: ['CFS', 'CFS', 'CFS', 'CFS', 'CFS', 'GFS', 'CFS', 'CFS', 'CFS', 'CFS']
        }, {
            id: 'EO 280',
            name: 'DUST COLLECTOR VANTERM 1',
            spec: '11.200 M³',
            location: 'NBL 2, MEZZANINE LT.2',
            code: '1AS',
            status: ['CFS', 'CFS', 'CFS', 'CFS', 'CFS', 'GFS', 'CFS', 'CFS', 'CFS', 'CFS']
        }, {
            id: 'EO 281',
            name: 'DUST COLLECTOR VANTERM 2',
            spec: '14.000 M³',
            location: 'NBL 2, MEZZANINE LT.2',
            code: '1AS',
            status: ['CFS', 'CFS', 'CFS', 'CFS', 'CFS', 'GFS', 'CFS', 'CFS', 'CFS', 'CFS']
        }, {
            id: 'EO 284',
            name: 'CHILLER CARRIER',
            spec: '305 TR',
            location: 'ROOF UTILITY, NBL 2',
            code: '1AS',
            status: ['CFS', 'CFS', 'CFS', 'CFS', 'CFS', 'GFS', 'CFS', 'CFS', 'CFS', 'CFS']
        }, {
            id: 'EO 286',
            name: 'KOMPRESOR OIL FREE KAESER CSG 125',
            spec: '12.5 M³/h',
            location: 'RUANG UTILITY LT.4 NBL 2',
            code: '2BS',
            status: ['CFS', 'CFS', 'CFS', 'CFS', 'CFS', 'GFS', 'CFS', 'CFS', 'CFS', 'CFS']
        }, {
            id: 'EO 288',
            name: 'DESICANT DRYER KAESER LDC 175',
            spec: '17.5 M³/h',
            location: 'RUANG UTILITY LT.4 NBL 2',
            code: '2BS',
            status: ['CFS', 'CFS', 'CFS', 'CFS', 'CFS', 'GFS', 'CFS', 'CFS', 'CFS', 'CFS']
        }];

        const months = ['JAN', 'FEB', 'MAR', 'APR', 'MEI', 'JUN', 'AUG', 'SEP', 'OCT', 'NOV'];

        // ─── Status Badge Component ──────────────────────────────────
        const StatusBadge = ({ value }) => {
            const isGFS = value === 'GFS';
            const base = 'inline-flex items-center justify-center px-3 py-1 text-xs font-bold rounded-full transition-all min-w-[52px]';
            if (isGFS) {
                return (
                    <span className={`${base} bg-red-100 text-red-700 border border-red-300 badge-gfs`}>
                        {value}
                    </span>
                );
            }
            return (
                <span className={`${base} bg-emerald-100 text-emerald-700 border border-emerald-300`}>
                    {value}
                </span>
            );
        };

        // ─── Main Table Component ────────────────────────────────────
        const MaintenanceTable = () => {
            // Track which rows are expanded (for mobile detail view)
            const [expandedRows, setExpandedRows] = useState({});

            const toggleRow = (id) => {
                setExpandedRows(prev => ({
                    ...prev,
                    [id]: !prev[id]
                }));
            };

            // ── Table Header Columns ──
            const headerCols = [
                { key: 'no', label: 'NO', className: 'w-20 min-w-[70px]' },
                { key: 'name', label: 'ME 8NNAME', className: 'min-w-[220px]' },
                { key: 'spec', label: 'ME 8NDAY', className: 'w-28 min-w-[100px]' },
                { key: 'location', label: 'A / KAPA', className: 'min-w-[180px]' },
                { key: 'code', label: 'BITA SNAME', className: 'w-24 min-w-[80px]' },
                { key: 'ruang', label: 'RUANG', className: 'min-w-[120px]' },
                { key: 'interval', label: 'INTERV/1 (BULAN SEKAL)', className: 'min-w-[130px]' },
                { key: 'kategori', label: 'KATEGORI', className: 'min-w-[100px]' },
                { key: 'me8n', label: 'ME 8N', className: 'w-20 min-w-[70px]' },
            ];

            // Month columns (dynamic)
            const monthCols = months.map((m, idx) => ({
                key: `month_${idx}`,
                label: m,
                className: 'w-20 min-w-[72px]'
            }));

            const allCols = [...headerCols, ...monthCols];

            return (
                <div className="max-w-7xl mx-auto bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden">
                    {/* ── Header / Title ── */}
                    <div className="px-6 py-4 bg-gradient-to-r from-slate-50 to-white border-b border-slate-200 flex items-center justify-between flex-wrap gap-3">
                        <div>
                            <h2 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                                <span className="bg-indigo-600 text-white text-xs px-3 py-1 rounded-full">SCHEDULE</span>
                                Maintenance &amp; Monitoring
                            </h2>
                            <p className="text-sm text-slate-500 mt-0.5">
                                {rawData.length} equipment · {months.length} month period
                            </p>
                        </div>
                        <div className="flex items-center gap-3 text-xs">
                            <span className="flex items-center gap-1.5">
                                <span className="w-3 h-3 rounded-full bg-emerald-400"></span>
                                CFS — Normal
                            </span>
                            <span className="flex items-center gap-1.5">
                                <span className="w-3 h-3 rounded-full bg-red-400 animate-pulse"></span>
                                GFS — Attention
                            </span>
                        </div>
                    </div>

                    {/* ── Scrollable Table ── */}
                    <div className="table-scroll overflow-x-auto">
                        <table className="w-full border-collapse text-sm">
                            {/* ─── HEADER ─── */}
                            <thead className="sticky-header">
                                <tr className="bg-slate-100/80 backdrop-blur-sm border-b-2 border-slate-200">
                                    {allCols.map((col, idx) => {
                                        // Merge month cells with a subtle divider
                                        const isMonth = col.key.startsWith('month_');
                                        return (
                                            <th
                                                key={col.key}
                                                className={`${col.className} px-3 py-3 text-left text-xs font-bold text-slate-600 uppercase tracking-wider ${isMonth ? 'border-l border-slate-200/70' : ''
                                                    } ${idx === 0 ? 'pl-5' : ''}`}
                                            >
                                                {col.label}
                                            </th>
                                        );
                                    })}
                                </tr>
                            </thead>

                            {/* ─── BODY ─── */}
                            <tbody>
                                {rawData.map((row, rowIdx) => {
                                    const isExpanded = expandedRows[row.id] || false;
                                    const statuses = row.status;

                                    return (
                                        <React.Fragment key={row.id}>
                                            <tr
                                                className={`table-row border-b border-slate-100 transition-colors ${rowIdx % 2 === 0 ? 'bg-white' : 'bg-slate-50/60'
                                                    }`}
                                                onClick={() => toggleRow(row.id)}
                                                style={{ cursor: 'pointer' }}
                                            >
                                                {/* NO */}
                                                <td className="px-3 py-3 pl-5 font-mono text-xs font-bold text-indigo-700">
                                                    {row.id}
                                                </td>
                                                {/* ME 8NNAME */}
                                                <td className="px-3 py-3 font-medium text-slate-800 whitespace-nowrap">
                                                    {row.name}
                                                </td>
                                                {/* ME 8NDAY */}
                                                <td className="px-3 py-3 text-slate-600 text-xs">
                                                    {row.spec}
                                                </td>
                                                {/* A / KAPA */}
                                                <td className="px-3 py-3 text-slate-600 text-xs">
                                                    {row.location}
                                                </td>
                                                {/* BITA SNAME */}
                                                <td className="px-3 py-3">
                                                    <span className="inline-block bg-slate-200/70 text-slate-700 text-[11px] font-semibold px-2.5 py-0.5 rounded-md">
                                                        {row.code}
                                                    </span>
                                                </td>
                                                {/* RUANG — placeholder */}
                                                <td className="px-3 py-3 text-slate-400 text-xs">—</td>
                                                {/* INTERV/1 — placeholder */}
                                                <td className="px-3 py-3 text-slate-400 text-xs">—</td>
                                                {/* KATEGORI — placeholder */}
                                                <td className="px-3 py-3 text-slate-400 text-xs">—</td>
                                                {/* ME 8N — placeholder */}
                                                <td className="px-3 py-3 text-slate-400 text-xs">—</td>

                                                {/* ─── Month Columns ─── */}
                                                {months.map((_, idx) => {
                                                    const val = statuses[idx] || '—';
                                                    return (
                                                        <td key={`${row.id}_month_${idx}`} className="px-2 py-2 text-center border-l border-slate-100/60">
                                                            <StatusBadge value={val} />
                                                        </td>
                                                    );
                                                })}
                                            </tr>

                                            {/* ─── Mobile Detail Row (expanded) ─── */}
                                            {isExpanded && (
                                                <tr className="sm:hidden bg-slate-50/80 border-b border-slate-200">
                                                    <td colSpan={allCols.length} className="px-4 py-3">
                                                        <div className="grid grid-cols-2 gap-1 text-xs text-slate-600">
                                                            <div><span className="font-semibold">ID:</span> {row.id}</div>
                                                            <div><span className="font-semibold">Code:</span> {row.code}</div>
                                                            <div className="col-span-2"><span className="font-semibold">Name:</span> {row.name}</div>
                                                            <div><span className="font-semibold">Spec:</span> {row.spec}</div>
                                                            <div className="col-span-2"><span className="font-semibold">Location:</span> {row.location}</div>
                                                            <div className="col-span-2 pt-1 flex flex-wrap gap-2">
                                                                {months.map((m, i) => (
                                                                    <div key={i} className="flex items-center gap-1.5 bg-white px-2 py-1 rounded border border-slate-200">
                                                                        <span className="font-bold text-slate-500 text-[10px]">{m}</span>
                                                                        <StatusBadge value={statuses[i] || '—'} />
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    </td>
                                                </tr>
                                            )}
                                        </React.Fragment>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>

                    {/* ── Footer ── */}
                    <div className="px-6 py-3 bg-slate-50 border-t border-slate-200 text-xs text-slate-400 flex items-center justify-between flex-wrap gap-2">
                        <span>Showing {rawData.length} entries</span>
                        <span className="flex items-center gap-4">
                            <span>CFS = <span className="text-emerald-600 font-medium">Normal</span></span>
                            <span>GFS = <span className="text-red-600 font-medium">Needs Attention</span></span>
                            <span className="hidden sm:inline">· Click a row for mobile details</span>
                        </span>
                    </div>
                </div>
            );
        };

        // ─── Render ──────────────────────────────────────────────────
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MaintenanceTable />);
    </script>

</body>
</html>
